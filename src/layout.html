<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Applies the saved theme before first paint; kept minimal on purpose. -->
  <script>try{var v=localStorage.getItem("vision");if(v==="dark"||v==="light")document.documentElement.dataset.theme=v}catch(e){}</script>
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="preload" href="assets/fonts/google-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/caveat-400.woff2" as="font" type="font/woff2" crossorigin>
  {{font_sizes}}
  <link rel="stylesheet" href="assets/site.css">
  <link rel="icon" href="favicon.ico">
  {{head}}
  <script defer src="assets/site.js"></script>
</head>
<body class="{{body_class}}">
<!--
Built in an era before the AI overlords took over the world.
Keeping it simple in the age of complex, fancy, and yet oh-all-the-same webpages.

Reminds me of my childhood days, when I'd spend a concerning amount of time
drawing margin lines on blank paper and writing the date in the top-right corner
of each page, just to delay the dread of the actual coding homework (which, ofc,
we had to write on that page).

I think this is how assembly programmers felt when C was announced, how C folks
felt about C++, and how C++ folks felt when Python went mainstream. The next
easier way to program our fancy electric sand castle is always "not the real
thing" to the older generation of purists. Today it's the LLMs, tomorrow it 
will be something else.

For the most part, you don't need to know the charge in your transistors,
and layout of your memory objects to watch a cat video. But if your cat 
video is slow, you can always go down the rabbit hole of debugging each 
abstraction layer. Eventually you'll reach the silicon, and then it helps
to know the properties of your sand arrangement.

Well, anyway, I have a detached GPG signature for the CV PDF. If you want to
verify it, my public key is on keyservers and on my GitHub profile.
  — Saket
-->
<a class="skip" href="#content">Skip to content</a>
<div class="page">
  <header class="row head">
    <div class="main">
      {{compact}}
    </div>
  </header>

  <!-- Wide landscape screens: a fixed sidebar on the right.
       Otherwise: rows at the top of the page. -->
  <aside class="row side">
    <div class="main">
      <div class="dp">
        <span>Date<b data-today>{{date}}</b></span>
        <span>Page<b>{{page}}</b></span>
      </div>
      {{label}}
      <nav class="cfg snap" aria-label="Site">
        {{nav}}
      </nav>
      {{contacts}}
    </div>
    <div class="margin">
      <button type="button" data-theme-toggle>
        <span class="when-light">Dark mode</span><span class="when-dark">Light mode</span>
      </button>
    </div>
  </aside>

  <main id="content">
{{content}}
  </main>

  <footer class="row">
    <div class="main">
      {{shloka}}
      <p class="colophon">© {{year}} Saket Upadhyay. <a href="blog.html" data-ink="writing">Blog</a>, <a href="credits.html" data-ink="thanks">credits</a>.</p>
    </div>
  </footer>
</div>
</body>
</html>
